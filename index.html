<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEURO</title>
  <style>
    /* Make body act as the 10px white border/padding around everything */
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #FFFFFF;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Top Left Corner Triangle */
    .corner-tl {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 196px;
      height: 196px;
      background-color: #000000;
      clip-path: polygon(0 0, 100% 0, 0 100%);
      cursor: pointer;
      z-index: 100;
      transition: background-color 0.2s;
    }
    
    /* Top Right Corner Triangle */
    .corner-tr {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 196px;
      height: 196px;
      background-color: #000000;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      cursor: pointer;
      z-index: 100;
      transition: background-color 0.2s;
    }

    .corner-tl:hover, .corner-tr:hover {
      background-color: #222222;
    }

    /* Git-Style Nested Menu Container - NOW ALMOST FULL SCREEN */
    .git-menu {
      position: fixed;
      top: 50px;
      left: 50px;
      right: 50px;
      bottom: 50px;
      z-index: 110; /* Bring above everything else */
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #333;
      padding: 60px;
      border-radius: 8px;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      
      /* Animation properties */
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98) translateY(10px);
      transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
      backdrop-filter: blur(10px);
      overflow-y: auto; /* Allow scrolling if the menu gets too tall */
    }

    .git-menu.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }

    /* Close Button inside the big menu */
    .close-menu {
      position: absolute;
      top: 30px;
      right: 40px;
      color: #777777;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .close-menu:hover {
      color: #FFFFFF;
    }

    /* Git Tree CSS Art - SCALED UP FOR LARGE SCREEN */
    .git-tree, .git-tree ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    
    .git-tree ul {
      padding-left: 50px; /* Wider indentation */
    }
    
    .git-tree li {
      margin: 0;
      padding: 20px 0 0 60px; /* Spaced out more */
      position: relative;
      color: #CCCCCC;
      font-family: 'Courier New', monospace;
      font-size: 28px; /* Larger font */
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .git-tree li:hover {
      color: #FFFFFF;
    }

    /* The Vertical Branch Line */
    .git-tree li::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 20px;
      border-left: 3px solid #555555; /* Thicker line */
    }

    /* The Horizontal Branch Line */
    .git-tree li::after {
      content: '';
      position: absolute;
      top: 38px; 
      left: 20px;
      width: 30px;
      border-top: 3px solid #555555; /* Thicker line */
    }

    /* The Commit Node (Circle) */
    .git-tree li > span::before {
      content: '';
      position: absolute;
      top: 28px;
      left: 9px;
      width: 18px; /* Larger node */
      height: 18px;
      background: #000000;
      border: 3px solid #555555;
      border-radius: 50%;
      z-index: 1;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .git-tree li:hover > span::before {
      background: #FFFFFF;
      border-color: #FFFFFF;
      transform: scale(1.2); /* Slight pop effect on hover */
    }

    /* Stop the vertical line from extending past the last item */
    .git-tree li:last-child::before {
      bottom: auto;
      height: 38px; 
    }

    /* Main Background Container */
    .diagonal-corners {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      
      background-color: #0a0a0a;
      background-image: 
        linear-gradient(30deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
        linear-gradient(150deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
        linear-gradient(30deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
        linear-gradient(150deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
        linear-gradient(60deg, #1a1a1a 25%, transparent 25.5%, transparent 75%, #1a1a1a 75%, #1a1a1a),
        linear-gradient(60deg, #1a1a1a 25%, transparent 25.5%, transparent 75%, #1a1a1a 75%, #1a1a1a);
      background-size: 80px 140px;
      background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;

      clip-path: polygon(
        210px 0, 
        calc(100% - 210px) 0, 
        100% 210px, 
        100% 100%, 
        0 100%, 
        0 210px 
      );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pentagon-wrapper { position: relative; z-index: 10; }
    .pentagon-container { width: 750px; height: 750px; position: relative; }

    .triangle {
      position: absolute;
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 50%, 50% 0%, 97.5% 34.5%);
      transform-origin: 50% 50%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 180px;   
      padding-left: 210px;
      box-sizing: border-box;
    }

    .triangle span {
      font-family: 'Courier New', monospace; 
      font-size: 6rem;
      font-weight: bold;
      color: #FFFFFF;
    }

    .t1 { transform: rotate(0deg);   background: #111; }
    .t2 { transform: rotate(72deg);  background: #222; }
    .t3 { transform: rotate(144deg); background: #111; }
    .t4 { transform: rotate(216deg); background: #222; }
    .t5 { transform: rotate(288deg); background: #333; }

    .t1 span { transform: rotate(0deg); }
    .t2 span { transform: rotate(-72deg); }
    .t3 span { transform: rotate(-144deg); }
    .t4 span { transform: rotate(-216deg); }
    .t5 span { transform: rotate(-288deg); }
  </style>
</head>
<body>

  <div class="corner-tl" onclick="toggleMenu('menu-left')"></div>
  <div class="corner-tr" onclick="toggleMenu('menu-right')"></div>

  <div id="menu-left" class="git-menu">
    <div class="close-menu" onclick="closeAllMenus()">[X] CLOSE</div>
    <ul class="git-tree">
      <li><span>main</span>
        <ul>
          <li><span>systems</span>
            <ul>
              <li><span>core_logic</span></li>
              <li><span>neural_net</span></li>
            </ul>
          </li>
          <li><span>ui_components</span></li>
        </ul>
      </li>
      <li><span>docs</span></li>
    </ul>
  </div>

  <div id="menu-right" class="git-menu">
    <div class="close-menu" onclick="closeAllMenus()">[X] CLOSE</div>
    <ul class="git-tree">
      <li><span>settings</span>
        <ul>
          <li><span>preferences</span></li>
          <li><span>network</span></li>
        </ul>
      </li>
      <li><span>logout</span></li>
    </ul>
  </div>

  <div class="diagonal-corners">
    <div class="pentagon-wrapper">
      <div class="pentagon-container">
        <div class="triangle t1"><span>N</span></div>
        <div class="triangle t2"><span>E</span></div>
        <div class="triangle t3"><span>U</span></div>
        <div class="triangle t4"><span>R</span></div>
        <div class="triangle t5"><span>O</span></div>
      </div>
    </div>
  </div>

  <script>
    function toggleMenu(menuId) {
      const menu = document.getElementById(menuId);
      
      // If clicking the same menu that is already open, just close it
      if (menu.classList.contains('active')) {
        closeAllMenus();
        return;
      }

      // Otherwise, close others and open the requested one
      closeAllMenus();
      menu.classList.add('active');
    }

    function closeAllMenus() {
      document.querySelectorAll('.git-menu').forEach(m => m.classList.remove('active'));
    }

    // Close menus if the user clicks the background (outside the menu box and triangles)
    document.addEventListener('click', function(event) {
      if (!event.target.closest('.git-menu') && !event.target.closest('.corner-tl') && !event.target.closest('.corner-tr')) {
        closeAllMenus();
      }
    });
  </script>
</body>
</html>
