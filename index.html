<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEURO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <!-- Center Pentagon -->
  <div class="pentagon">
    <div class="tri t1">N</div>
    <div class="tri t2">E</div>
    <div class="tri t3">U</div>
    <div class="tri t4">R</div>
    <div class="tri t5">O</div>
  </div>

  <!-- Corners -->
  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>

</div>

</body>
</html>
