<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEURO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="diagonal-corners">
    <div class="pentagon-wrapper">
      
      <div class="pentagon-container layer-3">
        <div class="triangle o1"></div><div class="triangle o2"></div><div class="triangle o3"></div><div class="triangle o4"></div><div class="triangle o5"></div>
        <div class="triangle t1"></div><div class="triangle t2"></div><div class="triangle t3"></div><div class="triangle t4"></div><div class="triangle t5"></div>
      </div>

      <div class="pentagon-container layer-2">
        <div class="triangle o1"></div><div class="triangle o2"></div><div class="triangle o3"></div><div class="triangle o4"></div><div class="triangle o5"></div>
        <div class="triangle t1"></div><div class="triangle t2"></div><div class="triangle t3"></div><div class="triangle t4"></div><div class="triangle t5"></div>
      </div>

      <div class="pentagon-container layer-1">
        <div class="triangle o1"></div><div class="triangle o2"></div><div class="triangle o3"></div><div class="triangle o4"></div><div class="triangle o5"></div>
        <div class="triangle t1"><span>N</span></div>
        <div class="triangle t2"><span>E</span></div>
        <div class="triangle t3"><span>U</span></div>
        <div class="triangle t4"><span>R</span></div>
        <div class="triangle t5"><span>O</span></div>
      </div>

    </div>
  </div>
</body>
</html>
